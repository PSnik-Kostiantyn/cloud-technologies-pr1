specVersion: "3.0"
metadata:
  name: ns.helloworld
type: application
resources:
  configuration:
    propertiesFileSourceEncoding: UTF-8
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: ui5-task-zipper
      afterTask: generateCachebusterInfo
      configuration:
        archiveName: helloworld
        additionalFiles:
          - xs-app.json
